# FortiAIGate connector sample playbooks.
#
# Build with `python playbooks/build.py`, never by hand (the compiled JSON
# is stamped with the info.json version and frozen timestamps).
#
# Requires alongside this connector on the appliance:
#   - hashicorp-vault-kv (write-capable KV v2 connector), default config
#   - fortinet-fortiaigate in its default config

collection: Sample - Fortinet FortiAIGate - 1.3.1
description: >-
  Sample playbooks for the "Fortinet FortiAIGate" connector. If you are
  planning to use the sample playbooks in your environment, ensure that you
  clone those playbooks and move them to a different collection, since the
  sample playbook collection gets deleted during connector upgrade and
  delete.
visible: true
tags:
  - fortinet-fortiaigate
  - Fortinet
exported_tags:
  - fortinet-fortiaigate
  - Fortinet

playbooks:

  - name: Heal Expired FortiAIGate Key in Vault
    description: >-
      Keeps an application's FortiAIGate virtual key working. Reads the key
      from a HashiCorp Vault KV v2 secret and tests it against the data plane.
      If it no longer works, the playbook renews the same key - an expired key
      is extended (FortiAIGate only rotates an active key) and then rotated -
      writes the new secret into the same Vault path as a new version, and
      checks that the new secret works. The key keeps its id, name, limits,
      policies and model access; every other field of the secret is kept. A
      key that still works is left alone, and a revoked or suspended key stops
      the run with a message.

      Inputs: secret_path (the KV v2 path, for example lab/ai) and, when the
      key is not stored under api_key, key_field. Outputs: rotation_result
      (a one-line outcome), rotated (true or false), key_id and key_method
      (rotated or extended_and_rotated). Run it from a schedule, or call it
      as a child playbook once per secret.
    is_active: true
    parameters: [secret_path, key_field]
    steps:

      - name: Start
        type: start
        next: ResolvePath

      - name: ResolvePath
        type: set_variable
        next: ReadCurrentSecret
        comment: >-
          The Vault path of the secret holding the key, and the field it is
          stored in. Read from the playbook parameters (manual run, schedule,
          child call) or, for an API trigger that sends them as top-level
          variables, from vars.
        vars:
          secret_path: "{{ vars.input.params.secret_path | default(vars.secret_path, true) | default('lab/ai', true) }}"
          key_field: "{{ vars.input.params.key_field | default(vars.key_field, true) | default('api_key', true) }}"

      - name: ReadCurrentSecret
        type: connector
        next: CheckCurrentKey
        connector: hashicorp-vault-kv
        operation: read_secret
        config: ''
        params:
          path: '{{ vars.secret_path }}'

      - name: CheckCurrentKey
        type: connector
        next: KeyValid
        connector: fortinet-fortiaigate
        operation: check_key
        config: ''
        params:
          api_key: '{{ vars.steps.ReadCurrentSecret.data.data[vars.key_field] }}'

      - name: KeyValid
        type: decision
        next: RenewKey
        comment: Branch on the data-plane verdict for the stored key.
        conditions:
          - display: Invalid - renew
            when: "{{ vars.steps.CheckCurrentKey.data.valid | default(true) != true }}"
            next: RenewKey
          - display: Valid - nothing to do
            default: true
            next: AlreadyHealthy

      - name: RenewKey
        type: connector
        next: BuildPayload
        comment: >-
          Same key, new secret. FortiAIGate only rotates an active key, so an
          expired one is extended first.
        connector: fortinet-fortiaigate
        operation: renew_virtual_key
        config: ''
        params:
          key_id: ''
          api_key: '{{ vars.steps.ReadCurrentSecret.data.data[vars.key_field] }}'

      - name: BuildPayload
        type: set_variable
        next: WriteSecret
        comment: >-
          KV v2 writes create a new version and drop omitted fields, so the
          new secret data is the whole current secret with only the key field
          replaced. Built as a JSON string because connector params are strings.
        vars:
          payload: >-
            {{ (vars.steps.ReadCurrentSecret.data.data | combine({vars.key_field: vars.steps.RenewKey.data.new_secret})) | tojson }}

      - name: WriteSecret
        type: connector
        next: VerifyNewKey
        connector: hashicorp-vault-kv
        operation: write_secret
        config: ''
        params:
          path: '{{ vars.secret_path }}'
          secret_data: '{{ vars.payload }}'

      - name: VerifyNewKey
        type: connector
        next: NewKeyValid
        connector: fortinet-fortiaigate
        operation: check_key
        config: ''
        params:
          api_key: '{{ vars.steps.RenewKey.data.new_secret }}'

      - name: NewKeyValid
        type: decision
        next: Done
        comment: The new secret must validate; anything else fails the run.
        conditions:
          - display: New key valid
            when: '{{ vars.steps.VerifyNewKey.data.valid | default(false) }}'
            next: Done
          - display: New key invalid - run failed
            default: true
            next: FailRotation

      - name: AlreadyHealthy
        type: set_variable
        next: Done
        vars:
          rotation_outcome: no-op - stored key already valid
          rotated: false

      - name: FailRotation
        type: set_variable
        comment: Reachable only when the new secret does not validate.
        vars:
          rotation_outcome: failed - new secret rejected by the data plane
          rotated: false

      - name: Done
        type: set_variable
        comment: Terminal summary.
        vars:
          key_id: '{{ vars.steps.RenewKey.data.key_id | default("") }}'
          key_method: '{{ vars.steps.RenewKey.data.method | default("") }}'
          rotation_result: '{{ vars.rotation_outcome | default("renewed - new secret stored in Vault and verified") }}'
          rotated: '{{ vars.rotated | default(true) }}'
