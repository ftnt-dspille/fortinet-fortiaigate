# FortiAIGate connector sample playbooks.
#
# Build with `python playbooks/build.py`, never by hand (the compiled JSON
# is stamped with the info.json version and frozen timestamps).
#
# Requires alongside this connector on the appliance:
#   - hashicorp-vault-kv (write-capable KV v2 connector), default config
#   - fortinet-fortiaigate in its default config

collection: Sample - Fortinet FortiAIGate - 1.3.1
description: >-
  Sample playbooks for the "Fortinet FortiAIGate" connector. If you are
  planning to use the sample playbooks in your environment, ensure that you
  clone those playbooks and move them to a different collection, since the
  sample playbook collection gets deleted during connector upgrade and
  delete.
visible: true
tags:
  - fortinet-fortiaigate
  - Fortinet
exported_tags:
  - fortinet-fortiaigate
  - Fortinet

playbooks:

  - name: Heal Expired FortiAIGate Key in Vault
    description: >-
      Keeps an application's FortiAIGate virtual key working. Reads the key
      from a HashiCorp Vault KV v2 secret and tests it against the data plane.
      If it no longer works (expired, revoked or suspended), the playbook
      issues a replacement - FortiAIGate cannot rotate a key in that state, so
      it creates a new key in the same workspace with the same name, limits and
      policies - writes the new secret into the same Vault path as a new
      version, and checks that the new key works. Every other field of the
      secret is kept. A key that still works is left alone. A key that was
      revoked on purpose, or that has model groups or provider access (which a
      replacement would not inherit), stops the run with a message instead.

      Inputs: secret_path (the KV v2 path, for example lab/ai) and, when the
      key is not stored under api_key, key_field. Outputs: rotation_result
      (a one-line outcome), rotated (true or false), new_key_id and
      key_method (reissued or rotated). Run it from a schedule, or call it
      as a child playbook once per secret.
    is_active: true
    parameters: [secret_path, key_field]
    steps:

      - name: Start
        type: start
        next: ResolvePath

      - name: ResolvePath
        type: set_variable
        next: ReadCurrentSecret
        comment: The Vault path of the secret holding the key, and the field it is stored in.
        vars:
          secret_path: "{{ vars.input.params.secret_path | default('lab/ai', true) }}"
          key_field: "{{ vars.input.params.key_field | default('api_key', true) }}"

      - name: ReadCurrentSecret
        type: connector
        next: CheckCurrentKey
        connector: hashicorp-vault-kv
        operation: read_secret
        config: ''
        params:
          path: '{{ vars.secret_path }}'

      - name: CheckCurrentKey
        type: connector
        next: KeyValid
        connector: fortinet-fortiaigate
        operation: check_key
        config: ''
        params:
          api_key: '{{ vars.steps.ReadCurrentSecret.data.data[vars.key_field] }}'

      - name: KeyValid
        type: decision
        next: ReplaceKey
        comment: Branch on the data-plane verdict for the stored key.
        conditions:
          - display: Invalid - replace
            when: "{{ vars.steps.CheckCurrentKey.data.valid | default(true) != true }}"
            next: ReplaceKey
          - display: Valid - nothing to do
            default: true
            next: AlreadyHealthy

      - name: ReplaceKey
        type: connector
        next: BuildPayload
        comment: >-
          An expired, revoked or suspended key cannot be rotated, so this
          issues a replacement key (an active key would be rotated in place).
        connector: fortinet-fortiaigate
        operation: replace_virtual_key
        config: ''
        params:
          key_id: ''
          api_key: '{{ vars.steps.ReadCurrentSecret.data.data[vars.key_field] }}'

      - name: BuildPayload
        type: set_variable
        next: WriteSecret
        comment: >-
          KV v2 writes create a new version and drop omitted fields, so the
          new secret data is the whole current secret with only the key field
          replaced. Built as a JSON string because connector params are strings.
        vars:
          payload: >-
            {{ (vars.steps.ReadCurrentSecret.data.data | combine({vars.key_field: vars.steps.ReplaceKey.data.new_secret})) | tojson }}

      - name: WriteSecret
        type: connector
        next: VerifyNewKey
        connector: hashicorp-vault-kv
        operation: write_secret
        config: ''
        params:
          path: '{{ vars.secret_path }}'
          secret_data: '{{ vars.payload }}'

      - name: VerifyNewKey
        type: connector
        next: NewKeyValid
        connector: fortinet-fortiaigate
        operation: check_key
        config: ''
        params:
          api_key: '{{ vars.steps.ReplaceKey.data.new_secret }}'

      - name: NewKeyValid
        type: decision
        next: Done
        comment: The rotated key must validate; anything else fails the run.
        conditions:
          - display: New key valid
            when: '{{ vars.steps.VerifyNewKey.data.valid | default(false) }}'
            next: Done
          - display: New key invalid - run failed
            default: true
            next: FailRotation

      - name: AlreadyHealthy
        type: set_variable
        next: Done
        vars:
          rotation_outcome: no-op - stored key already valid
          rotated: false

      - name: FailRotation
        type: set_variable
        comment: Reachable only when the rotated key does not validate.
        vars:
          rotation_outcome: failed - rotated key rejected by the data plane
          rotated: false

      - name: Done
        type: set_variable
        comment: Terminal summary.
        vars:
          new_key_id: '{{ vars.steps.ReplaceKey.data.new_key_id | default("") }}'
          key_method: '{{ vars.steps.ReplaceKey.data.method | default("") }}'
          rotation_result: '{{ vars.rotation_outcome | default("replaced - new key stored in Vault and verified") }}'
          rotated: '{{ vars.rotated | default(true) }}'
