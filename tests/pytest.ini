[pytest]
testpaths = tests
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::DeprecationWarning
markers =
    live: tests that require a real FortiAIGate gateway (opt-in via tests/.env)
    mutate: mutating live tests (additionally require FAIG_ALLOW_MUTATE=true)
addopts = -ra -q
